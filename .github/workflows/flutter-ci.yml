
name: Flutter CI

on:
  push:
    branches:
      - main
      - feature/milkymoon-menu
  pull_request:
    branches:
      - main

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: Lab3/milkymoon
        run: flutter pub get

      - name: Analyze Flutter project
        working-directory: Lab3/milkymoon
        run: flutter analyze
